name: Bump version

# Bumps the patch component of the app version (VERSION.TXT / pyproject.toml)
# on every push to master, so each push is a new, distinct version. Skips
# itself on the bump commit it just made (via "[skip ci]" in the message)
# to avoid triggering infinitely.
on:
  push:
    branches: [master]

jobs:
  bump-version:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Bump patch version
        id: bump
        run: |
          new_version=$(python tools/bump_version.py)
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION.TXT pyproject.toml
          git commit -m "Bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
          git push
